
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendSense - Income Management</title>
</head>
<body>

    <header>
        <h1>SpendSense</h1>
        <h2>Income Management</h2>
        <p>Record and manage your income sources.</p>
    </header>

    <nav>
        <a href="index.html">Home</a> |
        <a href="income.html">Income Management</a>
    </nav>

    <hr>

    <main>
        <section>
            <h2>Add Income</h2>

            <form action="#" method="post">

                <label for="source">Income Source:</label><br>
                <select id="source" name="source" required>
                    <option value="">Select income source</option>
                    <option value="salary">Salary</option>
                    <option value="business">Business</option>
                    <option value="freelancing">Freelancing</option>
                    <option value="allowance">Allowance</option>
                    <option value="investment">Investment</option>
                    <option value="other">Other</option>
                </select>

                <br><br>

                <label for="amount">Amount (ETB):</label><br>
                <input
                    type="number"
                    id="amount"
                    name="amount"
                    min="0.01"
                    step="0.01"
                    required
                >

                <br><br>

                <label for="date">Date Received:</label><br>
                <input
                    type="date"
                    id="date"
                    name="date"
                    required
                >

                <br><br>

                <label for="description">Description:</label><br>
                <textarea
                    id="description"
                    name="description"
                    rows="4"
                    cols="30"
                ></textarea>

                <br><br>

                <button type="submit">Add Income</button>
                <button type="reset">Clear Form</button>

            </form>
        </section>

        <hr>

        <section>
            <h2>Income Records</h2>

            <table border="1">
                <thead>
                    <tr>
                        <th>Income Source</th>
                        <th>Amount (ETB)</th>
                        <th>Date Received</th>
                        <th>Description</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td colspan="4">No income records available.</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <hr>

        <section>
            <h2>Total Income</h2>
            <p>Total income: ETB 0.00</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SpendSense. All rights reserved.</p>
    </footer>

</body>
</html>
